name: Deploy demo to GitHub Pages

# The published site is assembled by scripts/build_pages.py, which copies the
# app's real CSS and D3 modules into docs/. Nothing is duplicated in the repo,
# so the demo cannot drift from the code the live app runs.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "app/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python scripts/build_pages.py --output _site

      # Matches assigned *values*, not the words. The legacy data files in this
      # project embed a real client id in every preview_url (`?cid=<32 hex>`),
      # which is the failure mode this guard exists for; matching the bare
      # identifier instead would also flag prose like "PKCE needs no
      # client_secret" and train everyone to ignore the alarm.
      - name: Fail if a credential reached the payload
        run: |
          if grep -rIqE 'cid=[0-9a-fA-F]{16,}|client_secret["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{16,}|BQ[A-Za-z0-9_-]{60,}' _site/; then
            echo "::error::Refusing to publish: build output contains a credential."
            grep -rIlE 'cid=[0-9a-fA-F]{16,}|client_secret["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{16,}|BQ[A-Za-z0-9_-]{60,}' _site/
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
